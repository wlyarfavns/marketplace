<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9FAFB"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Ambient Shadow -->
  <ellipse cx="400" cy="425" rx="270" ry="20" fill="#000000" opacity="0.14" />
  
  <!-- Shoe High Cut Geometry -->
  <g filter="url(#shadow)">
    <!-- Outsole & Midsole -->
    <path d="M 180,395 C 210,410 570,410 630,380 C 640,375 635,360 610,360 L 195,365 C 170,365 165,385 180,395 Z" fill="#B91C1C"/>
    <rect x="185" y="360" width="435" height="20" rx="3" fill="#FFFFFF"/>
    <line x1="190" y1="375" x2="615" y2="375" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Main Upper High-Top Body -->
    <path d="M 230,360 C 230,310 240,240 270,180 C 285,150 350,150 375,175 L 390,215 L 470,280 C 520,310 590,325 615,360 Z" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
    
    <!-- Toe Cap & Mudguard -->
    <path d="M 500,325 C 550,335 595,340 615,360 L 515,360 C 490,345 490,335 500,325 Z" fill="#B91C1C"/>
    
    <!-- High Ankle Collar & Heel Counter -->
    <path d="M 230,360 C 230,290 250,200 280,175 C 310,165 340,165 355,190 L 330,240 C 310,270 300,320 290,360 Z" fill="#B91C1C"/>
    <rect x="275" y="160" width="70" height="25" rx="5" fill="#B91C1C"/>
    
    <!-- Eyelets & Lacing -->
    <path d="M 370,185 L 480,295" stroke="#E0E0E0" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 360,195 L 385,190 M 380,220 L 405,215 M 405,245 L 430,240 M 430,270 L 455,265 M 460,295 L 485,290" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Brand Emblem -->
    <circle cx="380" cy="245" r="7" fill="#B91C1C" />
                   <path d="M 377,252 L 383,252 L 388,275 L 405,295 L 398,300 L 385,282 L 375,302 L 368,298 L 375,275 Z" fill="#B91C1C" />
                   <path d="M 360,260 L 375,268 L 395,262" stroke="#B91C1C" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Badge Label -->
  <g transform="translate(40, 50)">
    <rect width="130" height="26" rx="4" fill="#000000"/>
    <text x="65" y="17" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="2">AIR-JORDAN</text>
  </g>
  <text x="40" y="105" fill="#111827" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">Air Jordan 1 High OG Chicago</text>
</svg>